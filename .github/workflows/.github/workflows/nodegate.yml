name: Independent node gate validation
on:
  push:
    branches: [review/node-gate-independent-20261125]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: grimoire-rs/grimoire
          ref: 72d3fce16fa93890f0cddef4a8d7443c980716ab
          submodules: recursive
          persist-credentials: false
      - name: Apply and verify independent candidate
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/candidate.patch
          echo '3a9484cf653b129621143251ffe79ca2313d962976a7ea23fa0c5ec38f403b17  /tmp/candidate.patch' | sha256sum -c -
          git apply --check /tmp/candidate.patch
          git apply /tmp/candidate.patch
          echo 'e6ea4f557b09b5a8d11d07e414f49ba69322182838a6674987cb1d273695d51b  test/tools/require_all_passed.py' | sha256sum -c -
          echo '07b64feb6d6c3568cc3fcc8604a1aff0ed9da57db3d310737fbbf30627ebdd1f  test/tests/test_require_all_passed.py' | sha256sum -c -
          git diff --check
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f
        with:
          tool: cargo-nextest
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - uses: ocx-sh/setup-ocx@eaeb6788da6191868a1310cc2bba93233b586369
        with:
          version: "0.6.8"
          groups: default
      - name: Focused gate tests and lint
        run: |
          ocx exec -- ruff check test/tools/require_all_passed.py test/tests/test_require_all_passed.py
          ocx exec -- ruff format --check test/tools/require_all_passed.py test/tests/test_require_all_passed.py
          cd test
          ocx exec -- uv run pytest tests/test_require_all_passed.py tests/test_accept_floor.py -q
      - name: Full contribution verification on applied tree
        env:
          CARGO_BUILD_JOBS: "2"
        run: task --force verify
